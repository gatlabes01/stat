name: Publish trending searches



on:

  schedule:

  # Poll Trends RSS every 5 minutes (max 5 new articles/run via env).

    - cron: "*/5 * * * *"

  workflow_dispatch:



permissions:

  contents: write



concurrency:

  group: publish-trending

  cancel-in-progress: false



jobs:

  publish:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4



      - uses: actions/setup-python@v5

        with:

          python-version: "3.11"

          cache: pip

          cache-dependency-path: publisher/requirements.txt



      - uses: actions/cache@v4

        with:

          path: |

            publisher/data/trending.db

            publisher/data/trending_media

          key: detailz-trending-${{ hashFiles('publisher/data/trending.db') }}

          restore-keys: |

            detailz-trending-



      - name: Install dependencies

        run: pip install -r publisher/requirements.txt



      - name: Sync trends, export, push

        env:

          SITE_URL: https://detailz.xyz

          TRENDING_BASE_PATH: /trending

          TRENDING_GEO: US

          TRENDING_MAX_PER_RUN: "1"

          TRENDING_MIN_TRAFFIC_SCORE: "200"

          REPO_ROOT: ${{ github.workspace }}

          EXPORT_DIR: ${{ github.workspace }}

          GIT_REMOTE: origin

          GIT_BRANCH: main

          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}

        run: |

          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          python publisher/tools/trending_publisher.py --deploy github
