{% macro voice_head(page_title, meta_description, canonical, extra_head='') %}
<!DOCTYPE html>
<html lang="en-US" class="no-js no-svg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="user-scalable=yes, width=device-width, initial-scale=1.0, maximum-scale=1, minimum-scale=1">
<title>{{ page_title }}</title>
<meta name="description" content="{{ meta_description }}">
<meta name="robots" content="index, follow, max-image-preview:large">
<link rel="canonical" href="{{ canonical }}">
<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Open+Sans%3A400%7CRoboto+Slab%3A400%2C300&amp;display=swap">
<link rel="stylesheet" href="/wp-content/themes/voice/assets/css/min.css?ver=2.9.9">
<link rel="stylesheet" href="{{ url_for('/static/news.css') }}">
{% if google_site_verification %}
<meta name="google-site-verification" content="{{ google_site_verification }}">
{% endif %}
{{ extra_head }}
<script async src="https://www.googletagmanager.com/gtag/js?id=G-FYM5BSJPNZ"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-FYM5BSJPNZ');
</script>
</head>
<body class="wp-embed-responsive wp-theme-voice vce-sid-right voice-v_2_9_9 {{ body_class|default('') }}">
<div id="vce-main">
<header id="header" class="main-header">
<div class="container header-main-area header-3-wrapper">
  <div class="site-branding">
    <span class="site-title"><a href="/" rel="home" class="has-logo">
      <img src="/wp-content/uploads/2022/06/newlogo-1.png" alt="Detailz" class="vce-logo">
    </a></span>
  </div>
  <nav id="site-navigation" class="main-navigation" role="navigation">
    <ul class="nav-menu">
      <li><a href="/">Home</a></li>
      <li><a href="/category/entertainment/">Entertainment</a></li>
      <li><a href="/category/celebs/">Celebs</a></li>
      <li class="current-menu-item"><a href="{{ url_for('/') }}" aria-current="page">News</a></li>
    </ul>
  </nav>
</div>
</header>
<div id="main-wrapper">
{% endmacro %}

{% macro voice_footer() %}
<footer id="footer" class="site-footer">
  <div class="container">
    <div class="site-info">{{ copyright_notice }}</div>
  </div>
</footer>
</div>
</body>
</html>
{% endmacro %}
